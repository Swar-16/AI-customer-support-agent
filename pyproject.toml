[project]
name = "support-ai"
version = "0.1.0"
description = "Production-oriented AI customer support platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "python-dotenv"
]

[tool.pytest.ini_options]
testpaths = ["tests"]